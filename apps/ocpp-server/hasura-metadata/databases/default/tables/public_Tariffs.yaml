table:
  name: Tariffs
  schema: public
object_relationships:
  - name: Tenant
    using:
      foreign_key_constraint_on: tenantId
array_relationships:
  - name: Authorizations
    using:
      foreign_key_constraint_on:
        column: tariffId
        table:
          name: Authorizations
          schema: public
  - name: Connectors
    using:
      foreign_key_constraint_on:
        column: tariffId
        table:
          name: Connectors
          schema: public
  - name: MeterValues
    using:
      foreign_key_constraint_on:
        column: tariffId
        table:
          name: MeterValues
          schema: public
  - name: Transactions
    using:
      foreign_key_constraint_on:
        column: tariffId
        table:
          name: Transactions
          schema: public
select_permissions:
  - role: user
    permission:
      columns: '*'
      filter:
        tenantId:
          _eq: x-hasura-tenant-id
      allow_aggregations: true
    comment: ''
