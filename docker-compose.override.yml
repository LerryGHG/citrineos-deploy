# Deployment overrides for the self-hosted server stack.
#
# Everything that differs per server - its IP and every password/secret -
# comes from a `.env` file next to this one, which docker compose reads
# automatically for the ${...} references below. That file is gitignored and
# exists only on the server; `scripts/init-env.sh` creates it, and
# `scripts/set-server-ip.sh` updates SERVER_IP in it. So the tracked files are
# never edited on the server and `git pull` there is always clean.
#
# Browsers reach the stack only through the `proxy` service, on one HTTPS
# address (https://<SERVER_IP>). The databases, broker, object store, Hasura,
# Keycloak and the CSMS REST API are no longer published on the host; only
# the proxy and the OCPP ports chargers connect to are.
#
# `!override` replaces a base list instead of appending to it; `!reset`
# removes the base value entirely.
services:
  # Long-running services come back on their own after a reboot or a Docker
  # restart. Docker's restart policy ignores depends_on, so at boot the
  # services race each other; one that starts before its database/broker just
  # exits and is retried with backoff. The one-shot init containers
  # (minio-permissions-init, minio-init, db-init, hasura-metadata-init,
  # keycloak-db-init) deliberately get NO policy: `unless-stopped` would re-run
  # them forever once they finish. `unless-stopped` rather than `always` so a
  # deliberate `docker compose stop` stays stopped across a Docker restart.
  ocpp-db:
    restart: unless-stopped
    environment:
      # Only read when the database is first created; changing it later
      # needs an ALTER USER as well (see RUNBOOK.md).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env - see scripts/init-env.sh}
    ports: !reset []

  amqp-broker:
    restart: unless-stopped
    environment:
      # Only read when RabbitMQ's data directory is first created.
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set in .env}
    ports: !reset []

  # Both minio/minio and minio/mc on Docker Hub are gone entirely ("repository
  # does not exist"), and quay.io/minio/* now issues anonymous pull tokens with
  # zero grants (401). bitnamilegacy/* (Bitnami's frozen-free mirror) still
  # pulls anonymously; if that stops too, self-hosting a copy is the fix.
  #
  # The image runs as a baked-in non-root uid (1001), which can't write a
  # bind-mounted host directory Docker creates fresh (owned root);
  # minio-permissions-init fixes that before minio starts. Its entrypoint.sh
  # execs `minio server ...` directly when the first arg is "server" (the base
  # file's command), so nothing else in the base definition needs changing.
  minio-permissions-init:
    image: bitnamilegacy/minio:latest
    entrypoint: ['sh', '-c', 'mkdir -p /data && chown -R 1001:1001 /data']
    user: '0'
    volumes:
      - ./apps/ocpp-server/data/minio:/data
  minio:
    restart: unless-stopped
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    ports: !reset []
    depends_on:
      minio-permissions-init:
        condition: service_completed_successfully
  minio-init:
    image: bitnamilegacy/minio-client:latest
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    entrypoint: ['sh', '-c', 'mc alias set myminio http://minio:9000 minioadmin "$$MINIO_ROOT_PASSWORD"']

  graphql-engine:
    # The cli-migrations variant's entrypoint spins up a temporary internal
    # server on :9691 and polls it over localhost before starting the real
    # one; on this host that self-poll never succeeds within its 30s window
    # and the container restart-loops. This repo only mounts Hasura *metadata*
    # (not SQL migrations), so use the plain image.
    image: hasura/graphql-engine:v2.40.3
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://citrine:${POSTGRES_PASSWORD:?set in .env}@ocpp-db:5432/citrine
      # Server-side only now (hasura-metadata-init uses it). Browsers used to
      # be handed this secret, which let every logged-in account - `user`
      # included - bypass all permissions. They now authenticate with their
      # Keycloak token instead (HASURA_GRAPHQL_JWT_SECRET below).
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:?set in .env}
      # Verify Keycloak access tokens and take the Hasura role from the
      # `roles` claim (a protocol mapper on the citrineos-ui client puts the
      # user's client roles there). `admin` gets Hasura's full access; `user`
      # gets the read-only permissions in hasura-metadata. No issuer check:
      # the issuer contains the server IP, and the signature already ties the
      # token to this realm's keys.
      HASURA_GRAPHQL_JWT_SECRET: >-
        {"jwk_url": "http://keycloak:8080/auth/realms/citrineos/protocol/openid-connect/certs",
         "claims_map": {"x-hasura-allowed-roles": {"path": "$$.roles"},
                        "x-hasura-default-role": {"path": "$$.roles[0]"},
                        "x-hasura-user-id": {"path": "$$.sub"},
                        "x-hasura-tenant-id": {"path": "$$.tenant_id", "default": "1"}}}
      # The console isn't reachable through the proxy anyway; dev mode would
      # put internal error details into API responses.
      HASURA_GRAPHQL_ENABLE_CONSOLE: 'false'
      HASURA_GRAPHQL_DEV_MODE: 'false'
    ports: !reset []
    # Hasura exits if it can't fetch Keycloak's signing keys at startup. At
    # boot the restart policy retries until Keycloak is up; this makes
    # `docker compose up` wait instead of giving up on everything after it.
    depends_on:
      keycloak:
        condition: service_healthy

  # One-shot, idempotent SQL applied on every start (files in apps/ocpp-server/sql):
  #  - card-labels.sql: the CardLabels table (friendly names for RFID cards) used
  #    by the operator UI's Cars tab. Must finish before Hasura metadata is
  #    applied, because that metadata tracks this table.
  #  - station-delete-fix.sql: lets a station with history be deleted.
  db-init:
    image: postgis/postgis:16-3.5
    entrypoint: ['psql']
    command: ['-v', 'ON_ERROR_STOP=1', '-h', 'ocpp-db', '-U', 'citrine', '-d', 'citrine', '-f', '/sql/card-labels.sql', '-f', '/sql/station-delete-fix.sql']
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - ./apps/ocpp-server/sql:/sql:ro
    depends_on:
      ocpp-db:
        condition: service_healthy
      citrine:
        condition: service_healthy

  # The plain Hasura image never auto-applies metadata the way the
  # cli-migrations variant would, so on a brand-new database no tables would be
  # tracked ("no_queries_available"). This applies it on every `up` with the
  # cli-migrations image's bundled hasura-cli - idempotent.
  hasura-metadata-init:
    image: hasura/graphql-engine:v2.40.3.cli-migrations-v3
    entrypoint: ['hasura-cli']
    command: ['metadata', 'apply', '--admin-secret', '${HASURA_ADMIN_SECRET:?set in .env}', '--skip-update-check']
    working_dir: /project
    volumes:
      - ./apps/ocpp-server/config.yaml:/project/config.yaml
      - ./apps/ocpp-server/hasura-metadata:/project/hasura-metadata
    depends_on:
      citrine:
        condition: service_healthy
      graphql-engine:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  # The base file's `pull_policy: always` would make every plain
  # `docker compose up -d` re-pull upstream's citrineos-server over the image
  # built locally from this repo (docker-compose.local.yml). Upstream's image
  # has a different layout, so the CSMS then dies at startup with "Websocket
  # servers config file not found". Build it with `docker compose ... build citrine`.
  citrine:
    pull_policy: never
    restart: unless-stopped
    environment:
      CITRINEOS_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      CITRINEOS_MESSAGEBROKER_AMQP_URL: amqp://guest:${RABBITMQ_PASSWORD:?set in .env}@amqp-broker:5672
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set in .env}
      # The REST API (station commands) used to accept requests from anyone on
      # the network with no login. Verify the caller's Keycloak token and apply
      # rbac-rules.json (mounted below). Issuer/audience left empty on purpose,
      # same reason as Hasura's: the signature is checked against this realm.
      CITRINEOS_AUTH: >-
        {"oidc": {"jwksUri": "http://keycloak:8080/auth/realms/citrineos/protocol/openid-connect/certs",
                  "issuer": "", "audience": ""}}
    volumes:
      # The loader reads rbac-rules.json from the process working directory,
      # which in the image is the repo root, not apps/ocpp-server where the
      # file lives - without this every request would be denied.
      - ./apps/ocpp-server/rbac-rules.json:/usr/local/apps/citrineos/rbac-rules.json:ro
    # Only what chargers connect to. The REST API (8080) is reachable through
    # the proxy at /core; 9229 (Node inspector) was published but unused.
    ports: !override
      - 8081:8081
      - 8082:8082
      - 8443:8443
      - 8444:8444

  citrine-ui:
    restart: unless-stopped
    depends_on:
      hasura-metadata-init:
        condition: service_completed_successfully
    build:
      args:
        NEXT_PUBLIC_API_URL: https://${SERVER_IP:?set in .env}/v1/graphql
        NEXT_PUBLIC_WS_URL: wss://${SERVER_IP:?set in .env}/v1/graphql
        NEXT_PUBLIC_CITRINE_CORE_URL: https://${SERVER_IP:?set in .env}/core
        NEXT_PUBLIC_KEYCLOAK_URL: https://${SERVER_IP:?set in .env}/auth
    # These take precedence over the env_file (.env.local) the base file adds.
    environment:
      NEXTAUTH_URL: https://${SERVER_IP:?set in .env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set in .env}
      NEXT_PUBLIC_KEYCLOAK_URL: https://${SERVER_IP:?set in .env}/auth
      # Server-to-server calls from the UI container go straight to Keycloak.
      KEYCLOAK_SERVER_URL: http://keycloak:8080/auth
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set in .env}
      # Empty on purpose: with no admin secret the UI authorizes every Hasura
      # request with the user's own token, so permissions actually apply.
      HASURA_ADMIN_SECRET: ''
    ports: !reset []
    # The base file sets pull_policy: always, which would re-pull upstream's
    # image over the one built locally (see docker-compose.local.yml).
    pull_policy: never

  # Keycloak needs its own database. ocpp-db already runs Postgres for
  # everything else, so this adds a second database ("keycloak") on the same
  # instance. Idempotent: plain CREATE DATABASE errors if it already exists.
  keycloak-db-init:
    image: postgis/postgis:16-3.5
    entrypoint: ['sh', '-c']
    command:
      - >
        psql -v ON_ERROR_STOP=1 -h ocpp-db -U citrine -d citrine -tAc
        "SELECT 1 FROM pg_database WHERE datname='keycloak'" | grep -q 1 ||
        psql -v ON_ERROR_STOP=1 -h ocpp-db -U citrine -d citrine -c
        "CREATE DATABASE keycloak OWNER citrine"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    depends_on:
      ocpp-db:
        condition: service_healthy

  # Identity provider behind the operator UI's admin/user login split. Served
  # under /auth through the proxy. KC_HOSTNAME is fixed rather than detected:
  # Keycloak puts it in every token's `iss`, and the UI checks `iss` against
  # NEXT_PUBLIC_KEYCLOAK_URL - fixing it keeps tokens identical whether they
  # were fetched by the browser (through the proxy) or by the UI container
  # (directly, as keycloak:8080).
  keycloak:
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:latest
    command: ['start', '--http-enabled=true', '--import-realm']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://ocpp-db:5432/keycloak
      KC_DB_USERNAME: citrine
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      KC_HOSTNAME: https://${SERVER_IP:?set in .env}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      # Read only on the very first start, to create the console admin.
      KC_BOOTSTRAP_ADMIN_USERNAME: kcadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set in .env}
      # Substituted into apps/ocpp-server/keycloak/citrineos-realm.json, which
      # is only imported when the realm doesn't exist yet. Afterwards change
      # passwords in the Keycloak console, not here.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set in .env}
      CITRINEOS_ADMIN_PASSWORD: ${CITRINEOS_ADMIN_PASSWORD:?set in .env}
      CITRINEOS_USER_PASSWORD: ${CITRINEOS_USER_PASSWORD:?set in .env}
    ports: !reset []
    volumes:
      - ./apps/ocpp-server/keycloak:/opt/keycloak/data/import:ro
    # Readiness from the management port (KC_HEALTH_ENABLED). The image has
    # no curl or wget, so speak HTTP over bash's /dev/tcp; 503 until ready.
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200 "']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully

  # The single HTTPS entry point (see apps/ocpp-server/proxy/Caddyfile).
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SERVER_IP: ${SERVER_IP:?set in .env}
    ports:
      - 80:80
      - 443:443
      # Old addresses, kept only as redirects to https://<SERVER_IP>.
      - 3010:3010
      - 8180:8180
    volumes:
      - ./apps/ocpp-server/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy's local CA and certificates; must persist (see the Caddyfile).
      - ./apps/ocpp-server/data/caddy:/data
    depends_on:
      - citrine-ui
      - keycloak
      - graphql-engine
      - citrine
