# Local port remap to avoid clashing with an unrelated "ocpp-simulate"
# container that also uses 3000 on this host.
# `!override` fully replaces the base ports list instead of appending to it.
services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
  minio-init:
    image: quay.io/minio/mc:latest
  graphql-engine:
    # The cli-migrations variant's entrypoint spins up a temporary internal
    # server on :9691 and polls it over localhost to apply migrations before
    # starting the real server; on this host that self-poll never succeeds
    # within its 30s window and the container restart-loops forever. This repo
    # only mounts Hasura *metadata* (not SQL migrations), so the migrations
    # wrapper isn't needed — use the plain image instead.
    image: hasura/graphql-engine:v2.40.3
    environment:
      # The operator UI's data-provider already sends x-hasura-admin-secret
      # (read from apps/operator-ui/.env.local's HASURA_ADMIN_SECRET) to get
      # the real Hasura superadmin bypass. But the base compose file never
      # configures a secret here, so Hasura had nothing to check that header
      # against and fell back to enforcing role permissions — and the seeded
      # metadata only defines permissions for a role named "user", never
      # "admin", so the admin login could pass login but every mutation
      # (e.g. creating a charging station) was denied. Setting the same
      # secret here restores the intended superadmin bypass.
      HASURA_GRAPHQL_ADMIN_SECRET: 'CitrineOS!'
  # The plain image swapped in above never auto-applies Hasura metadata on
  # startup the way the cli-migrations variant normally would (that's its
  # whole job — see the comment on graphql-engine). On a brand-new database
  # this leaves zero tables tracked in Hasura (GraphQL queries return
  # "no_queries_available") until someone applies it by hand, which is a trap
  # for the next fresh deploy. This one-shot container does it automatically
  # on every `up`, using the cli-migrations image's own bundled `hasura-cli`
  # binary against the already-running plain server — idempotent, safe to
  # re-run against a database that's already had it applied.
  # One-shot, idempotent SQL applied on every start (files in apps/ocpp-server/sql):
  #  - card-labels.sql: the CardLabels table (friendly names for RFID cards) used
  #    by the operator UI's Cars tab. Must finish before Hasura metadata is
  #    applied, because that metadata tracks this table.
  #  - station-delete-fix.sql: lets a station with history be deleted.
  db-init:
    image: postgis/postgis:16-3.5
    entrypoint: ['psql']
    command: ['-v', 'ON_ERROR_STOP=1', '-h', 'ocpp-db', '-U', 'citrine', '-d', 'citrine', '-f', '/sql/card-labels.sql', '-f', '/sql/station-delete-fix.sql']
    environment:
      PGPASSWORD: citrine
    volumes:
      - ./apps/ocpp-server/sql:/sql:ro
    depends_on:
      ocpp-db:
        condition: service_healthy
      citrine:
        condition: service_healthy
  hasura-metadata-init:
    image: hasura/graphql-engine:v2.40.3.cli-migrations-v3
    entrypoint: ['hasura-cli']
    command: ['metadata', 'apply', '--admin-secret', 'CitrineOS!', '--skip-update-check']
    working_dir: /project
    volumes:
      - ./apps/ocpp-server/config.yaml:/project/config.yaml
      - ./apps/ocpp-server/hasura-metadata:/project/hasura-metadata
    depends_on:
      citrine:
        condition: service_healthy
      graphql-engine:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
  citrine-ui:
    depends_on:
      hasura-metadata-init:
        condition: service_completed_successfully
    ports: !override
      - "3010:3000"
    # The base file sets pull_policy: always, which re-pulls and clobbers a
    # locally-built image sharing the same tag. Pin to the local image once
    # `docker compose -f docker-compose.yml -f docker-compose.local.yml build
    # citrine-ui` has been run (see docker-compose.local.yml).
    pull_policy: never
